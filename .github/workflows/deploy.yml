# 배포는 수동으로만 돈다. develop에 뭐가 들어가든 누를 때까지 서버는 그대로다.
# 안정되면 push 트리거로 바꾼다.
name: deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 배포할 브랜치나 태그
        required: true
        default: develop

concurrency:
  # 배포가 겹치면 서버에서 두 빌드가 같은 컨테이너를 건드린다.
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 서버에서 최신 코드로 다시 띄운다
        env:
          REF: ${{ inputs.ref }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "REF='$REF' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/toasty
          git fetch --all --prune
          # 배포 서버에는 손으로 고친 코드가 없어야 한다. 항상 원격 기준으로 맞춘다.
          git reset --hard "origin/$REF"
          bash scripts/deploy.sh
          REMOTE

      - name: 실패하면 키를 지운다
        if: always()
        run: rm -f ~/.ssh/deploy_key
