# 배포 서버용. Caddy·앱·Redis를 띄우고 MySQL은 RDS를 쓴다. 실행:
#   docker compose -f docker/prod/docker-compose.yml up -d
#
# 컨테이너 이름은 고정하지 않는다. 로컬 개발용 compose와 이름이 겹쳐 한쪽이 못 뜬다.
# 비밀값은 이 파일 옆(docker/prod/.env)에 둔다. compose가 env_file을 이 파일 기준으로 찾는다.
# AWS 자격증명은 넣지 않는다. SDK가 EC2 인스턴스 역할에서 가져간다.
services:
  app:
    build:
      # compose 파일 기준 상대 경로다. 저장소 루트의 Dockerfile을 쓴다.
      context: ../..
      dockerfile: Dockerfile
    image: toasty:latest
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 같은 compose 네트워크 안에서는 서비스 이름으로 붙는다.
      REDIS_HOST: redis
    # 포트를 밖으로 열지 않는다. 열어두면 HTTPS를 건너뛰고 8080으로 바로 들어올 수 있다.
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  redis:
    image: redis:7-alpine
    # 리프레시 토큰이 여기 있다. 재시작으로 날아가면 모든 사용자가 다시 로그인해야 한다.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - toasty-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서가 여기 있다. 날리면 재배포마다 새로 발급받아 Let's Encrypt 횟수 제한에 걸린다.
      - toasty-caddy-data:/data
      - toasty-caddy-config:/config
    # 앱 상태를 조건으로 걸지 않는다. 앱이 죽어 있어도 인증서 갱신은 계속돼야 한다.
    depends_on:
      - app
    restart: unless-stopped

volumes:
  toasty-redis-data:
  toasty-caddy-data:
  toasty-caddy-config:
