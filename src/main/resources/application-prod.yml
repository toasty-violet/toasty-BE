# 배포 전용 설정. SPRING_PROFILES_ACTIVE=prod 로 켠다.
#
# 여기서는 기본값을 두지 않는다. 다만 @ConfigurationProperties 바인딩은 해석하지 못한
# 플레이스홀더를 그대로 통과시켜서, 기본값을 없애는 것만으로는 기동이 멈추지 않는다.
# 실제로 끊는 건 ProdPropertiesValidator다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  jpa:
    properties:
      hibernate:
        format_sql: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

kakao:
  redirect-uri: ${KAKAO_REDIRECT_URI}

# 인가를 애노테이션이 전담하고 SecurityConfig는 모두 permitAll이라, 켜두면 누구나 API 구조를 본다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.toasty: INFO
