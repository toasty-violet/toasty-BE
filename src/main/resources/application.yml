spring:
  application:
    name: toasty

  # 루트 .env가 있으면 읽고 없으면 무시한다. 서버에서는 .env 없이 실제 환경변수가 주입된다.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/toasty?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:toasty}
    password: ${DB_PASSWORD:toasty}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # N+1을 in절로 묶어 완화한다.
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null

aws:
  ivs:
    region: ${AWS_REGION:ap-northeast-2}
    channel-type: ${IVS_CHANNEL_TYPE:BASIC}
    latency-mode: ${IVS_LATENCY_MODE:LOW}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PATCH,PUT,DELETE,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 정렬을 고정해 목록 순서가 매번 바뀌지 않게 한다.
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.toasty: DEBUG
    # DEBUG로 낮추면 요청·응답 본문이 찍혀 Stream Key가 로그에 남는다.
    software.amazon.awssdk: WARN
