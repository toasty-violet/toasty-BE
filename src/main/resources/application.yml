spring:
  application:
    name: toasty

  # 루트 .env가 있으면 읽고 없으면 무시한다. 서버에서는 .env 없이 실제 환경변수가 주입된다.
  config:
    import: optional:file:.env[.properties]

  docker:
    compose:
      file: docker/local/docker-compose.yml
      lifecycle-management: start-only

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/toasty?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:toasty}
    password: ${DB_PASSWORD:toasty}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # N+1을 in절로 묶어 완화한다.
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 버전이 타임스탬프라, 먼저 만든 마이그레이션이 나중에 머지되는 일이 생긴다.
    # 이 옵션이 없으면 이미 더 높은 버전이 적용된 DB에서 그 파일을 건너뛴다.
    out-of-order: true

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PATCH,PUT,DELETE,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/login/kakao}

jwt:
  secret: ${JWT_SECRET:}
  # 30m, 14d 처럼 단위를 붙일 수 있고, 단위가 없으면 밀리초로 읽는다.
  access-token-expiration: ${ACCESS_TOKEN_EXPIRATION:30m}

auth:
  # 리프레시 토큰은 JWT가 아니라 난수 문자열이라 jwt 설정과 분리한다.
  refresh-token:
    expiration: ${REFRESH_TOKEN_EXPIRATION:14d}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 정렬을 고정해 목록 순서가 매번 바뀌지 않게 한다.
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.toasty: DEBUG
