spring:
  application:
    name: toasty

  # 토큰으로만 인증해 시큐리티 기본 로그인 계정이 필요 없다.
  # 두면 기동할 때마다 쓰지도 않는 임시 비밀번호가 로그에 찍힌다.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  # 루트 .env가 있으면 읽고 없으면 무시한다. 서버에서는 .env 없이 실제 환경변수가 주입된다.
  config:
    import: optional:file:.env[.properties]

  docker:
    compose:
      file: docker/local/docker-compose.yml
      lifecycle-management: start-only

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/toasty?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:toasty}
    password: ${DB_PASSWORD:toasty}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # N+1을 in절로 묶어 완화한다.
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 타임스탬프 형식으로 버전을 관리하기 때문에 먼저 만든 마이그레이션이 나중에 머지되는 일을 방지
    out-of-order: true

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

aws:
  ivs:
    region: ap-northeast-2
    channel-type: BASIC

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  # 카카오 앱에서 client secret 사용을 끄면 값이 없는 게 정상이라 빈 기본값을 둔다.
  client-secret: ${KAKAO_CLIENT_SECRET:}
  # 프론트가 인가 요청에 쓴 값과 정확히 같아야 토큰 교환이 통과한다.
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/auth/login/callback}

auth:
  # 만료시간은 30m, 14d 처럼 단위를 붙여 쓴다.
  access-token:
    secret: ${JWT_SECRET}
    expiration: 30m
  refresh-token:
    expiration: 14d

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 정렬을 고정해 목록 순서가 매번 바뀌지 않게 한다.
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.toasty: DEBUG
    # DEBUG로 낮추면 요청·응답 본문이 찍혀 Stream Key가 로그에 남는다.
    software.amazon.awssdk: WARN
